name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:size
      - run: npm run build
      - run: git diff --exit-code

  # The Rust workspace (cooker + RVM/IFC/STEP converters). Runs alongside
  # `check`; the committed wasm itself is covered there: wasmSources.test.ts
  # fails when a module's Rust sources changed without a rebuild, and
  # wasmSmoke.test.ts pins what the binaries cook.
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust_src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # the toolchain pinned in rust_src/rust-toolchain.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust_src
      # third-party IFC models git doesn't carry; the script pins their bytes,
      # so the download is cached on its hash
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: convertSamples/ifc/*.ifc
          key: ifc-samples-${{ hashFiles('convertSamples/ifc/fetch-samples.sh') }}
      - name: Fetch IFC samples
        # the script reports a failed download but still exits 0
        run: |
          ../convertSamples/ifc/fetch-samples.sh | tee "$RUNNER_TEMP/fetch.log"
          ! grep -q FAILED "$RUNNER_TEMP/fetch.log"
      - run: cargo test --workspace --locked

  version-gate:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      # the branch name is PR-controlled text: it reaches the script as data
      # (env), never spliced into it
      - name: Only dev may target main
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          [ "$HEAD_REF" = "dev" ] || {
            echo "::error::PRs into main must come from dev (got $HEAD_REF)"
            exit 1; }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Version must be the next MAJOR.YY.RELEASE (CONTRIBUTING.md › Versioning and releases)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          NEW=$(node -p "require('./package.json').version")
          git show origin/main:package.json > /tmp/old.json
          OLD=$(node -p "require('/tmp/old.json').version")

          SEMVER='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          [[ "$NEW" =~ $SEMVER ]] ||
            fail "package.json version $NEW is not MAJOR.YY.RELEASE (three numbers, no leading zeros)"

          # No release: only for PRs that change nothing the app is built from
          # (EVENTS.md and src/ Markdown are built into /docs/ and the UI package).
          if [ "$NEW" = "$OLD" ]; then
            APP=$(git diff --name-only origin/main...HEAD | while read -r f; do
              case "$f" in
                .github/*|plans/*|README.md|CHANGELOG.md|DESIGN.md|CLAUDE.md) ;;
                EVENTS.md|src/*|docs/*) echo "$f" ;;
                *.md) ;;
                *) echo "$f" ;;
              esac
            done)
            [ -z "$APP" ] || fail "version unchanged ($NEW), but the PR changes app files: $(echo $APP | head -c 300)"
            echo "OK: no release, non-app changes only (v$NEW)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          IFS=. read -r NMAJ NYY NREL <<< "$NEW"
          IFS=. read -r OMAJ OYY OREL <<< "$OLD"
          YY=$(date -u +%y | sed 's/^0*//')

          [ "$NYY" = "$YY" ] || fail "YY is $NYY, expected the current year $YY ($NEW)"
          [ "$NMAJ" = "$OMAJ" ] || [ "$NMAJ" = "$((OMAJ + 1))" ] ||
            fail "MAJOR is $NMAJ; it stays $OMAJ or goes up by one (previous: $OLD)"
          if [ "$OYY" = "$YY" ]; then EXPECT=$((OREL + 1)); else EXPECT=1; fi
          [ "$NREL" = "$EXPECT" ] ||
            fail "RELEASE is $NREL, expected $EXPECT (previous: $OLD; it resets to 1 in a new year)"

          case "$TITLE" in
            *"v$NEW"*) ;;
            *) fail "PR title must contain v$NEW" ;;
          esac

          echo "OK: v$NEW (previous v$OLD)" >> "$GITHUB_STEP_SUMMARY"
