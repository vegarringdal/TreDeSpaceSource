name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:size
      - run: npm run build
      - run: git diff --exit-code

  # The Rust workspace (cooker + RVM/IFC/STEP converters). Runs alongside
  # `check`; the committed wasm itself is covered there by wasmSmoke.test.ts.
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust_src
    steps:
      - uses: actions/checkout@v4
      # the toolchain pinned in rust_src/rust-toolchain.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_src
      # third-party IFC models git doesn't carry; the script pins their bytes,
      # so the download is cached on its hash
      - uses: actions/cache@v4
        with:
          path: convertSamples/ifc/*.ifc
          key: ifc-samples-${{ hashFiles('convertSamples/ifc/fetch-samples.sh') }}
      - name: Fetch IFC samples
        # the script reports a failed download but still exits 0
        run: |
          ../convertSamples/ifc/fetch-samples.sh | tee "$RUNNER_TEMP/fetch.log"
          ! grep -q FAILED "$RUNNER_TEMP/fetch.log"
      - run: cargo test --workspace --locked

  version-gate:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Only dev may target main
        run: |
          [ "${{ github.head_ref }}" = "dev" ] || {
            echo "::error::PRs into main must come from dev (got ${{ github.head_ref }})"
            exit 1; }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version must be YY.N.0, incremented
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          NEW=$(node -p "require('./package.json').version")
          git show origin/main:package.json > /tmp/old.json
          OLD=$(node -p "require('/tmp/old.json').version")

          YY=$(date +%y)
          IFS=. read -r OMAJ OMIN _ <<< "$OLD"

          if [ "$OMAJ" = "$YY" ]; then
            EXPECT="$YY.$((OMIN + 1)).0"
          else
            EXPECT="$YY.1.0"
          fi

          [ "$NEW" = "$EXPECT" ] || {
            echo "::error::package.json is $NEW, expected $EXPECT (previous: $OLD)"
            exit 1; }

          case "$TITLE" in
            *"v$NEW"*) ;;
            *) echo "::error::PR title must contain v$NEW"; exit 1 ;;
          esac

          echo "OK: v$NEW" >> "$GITHUB_STEP_SUMMARY"