name: Container Dev image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/vegarringdal/tredespace-dev
  # run_number counts up per run of this workflow and is never reused; a
  # re-run of the same run keeps it and replaces that tag
  VERSION: DEVBUILD-${{ github.run_number }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Only dev may publish
        if: github.ref != 'refs/heads/dev'
        run: |
          echo "::error::dev images are built from dev only (got ${{ github.ref_name }})"
          exit 1

      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # APP_VERSION is the version the app shows (About, /build.version);
      # package.json is not touched. No provenance attestation, so each build
      # is exactly one package version and the cleanup below counts builds.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          build-args: APP_VERSION=${{ env.VERSION }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}

      # needs the repo to have the Admin role under the package's
      # "Manage Actions access"
      - name: Keep the last 5 builds
        uses: actions/delete-package-versions@v5
        with:
          package-name: tredespace-dev
          package-type: container
          min-versions-to-keep: 5

      - name: Summary
        run: echo "Pushed $IMAGE:$VERSION" >> "$GITHUB_STEP_SUMMARY"
