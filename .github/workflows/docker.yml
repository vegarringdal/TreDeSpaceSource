name: Docker image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing tag
        run: |
          V=${{ steps.ver.outputs.version }}
          if docker manifest inspect "ghcr.io/vegarringdal/tredespace:$V" >/dev/null 2>&1; then
            echo "::error::$V already published"
            exit 1
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/vegarringdal/tredespace:${{ steps.ver.outputs.version }}

      - name: Summary
        run: echo "Pushed ghcr.io/vegarringdal/tredespace:${{ steps.ver.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"