name: Container Prod image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    uses: ./.github/workflows/container-image.yml
    with:
      branch: main
      image: tredespace-prod
      prefix: ${{ vars.CONTAINER_IMAGE_PREFIX }}
    secrets:
      CONTAINER_REGISTRY_USERNAME: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
      CONTAINER_REGISTRY_PASSWORD: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
