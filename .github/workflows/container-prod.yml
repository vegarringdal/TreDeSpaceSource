name: Container Prod image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/vegarringdal/tredespace-prod

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Only main may publish
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::prod images are built from main only (got ${{ github.ref_name }})"
          exit 1

      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing tag
        run: |
          V=${{ steps.ver.outputs.version }}
          if docker manifest inspect "$IMAGE:$V" >/dev/null 2>&1; then
            echo "::error::$V already published"
            exit 1
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}

      - name: Summary
        run: echo "Pushed $IMAGE:${{ steps.ver.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
