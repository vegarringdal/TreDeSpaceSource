<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 732" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif" role="img" aria-label="Your app embeds the TreDeSpace viewer as an iframe; the viewer hosts sandboxed plugin panels that talk back over postMessage.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#2bc3d4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- page bg -->
  <rect x="0" y="0" width="1040" height="732" fill="#0a1220"/>

  <!-- OUTER: your app -->
  <rect x="30" y="30" width="980" height="672" rx="18" fill="#14202f" stroke="#26394e" stroke-width="1.5"/>
  <rect x="30" y="30" width="980" height="48" rx="18" fill="#0f1a28"/>
  <rect x="30" y="60" width="980" height="18" fill="#0f1a28"/>
  <line x1="30" y1="78" x2="1010" y2="78" stroke="#26394e" stroke-width="1.5"/>
  <circle cx="52" cy="54" r="5" fill="#7f8da0" opacity="0.9"/>
  <circle cx="70" cy="54" r="5" fill="#7f8da0" opacity="0.55"/>
  <circle cx="88" cy="54" r="5" fill="#7f8da0" opacity="0.35"/>
  <text x="112" y="59" class="mono" font-size="14" font-weight="600" fill="#7f8da0">3dviewer.company.com</text>
  <text x="294" y="59" class="mono" font-size="13" fill="#67798d">/ your product · uses tredespace-client.ts (the SDK)</text>
  <rect x="878" y="42" width="118" height="24" rx="12" fill="none" stroke="#7f8da0" stroke-width="1.3" opacity="0.8"/>
  <text x="937" y="58" text-anchor="middle" class="mono" font-size="11.5" font-weight="600" fill="#7f8da0">host origin</text>

  <!-- MIDDLE: viewer -->
  <rect x="72" y="118" width="896" height="558" rx="15" fill="#14202f" stroke="#2bc3d4" stroke-width="2"/>
  <rect x="72" y="118" width="896" height="44" rx="15" fill="#0f2f37"/>
  <rect x="72" y="146" width="896" height="16" fill="#0f2f37"/>
  <line x1="72" y1="162" x2="968" y2="162" stroke="#2bc3d4" stroke-width="1.4" opacity="0.55"/>
  <g stroke="#2bc3d4" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M96,131 L108,124 L120,131 L120,145 L108,152 L96,145 Z"/>
    <path d="M96,131 L108,138 L120,131 M108,138 L108,152"/>
  </g>
  <text x="134" y="146" class="mono" font-size="14" font-weight="700" fill="#2bc3d4">tredespace.com</text>
  <text x="298" y="146" class="mono" font-size="13" fill="#67798d">/ embedded &lt;iframe&gt; · WebGPU CAD viewer</text>
  <g transform="translate(818,127)">
    <rect x="0" y="0" width="134" height="26" rx="13" fill="#0f2f37" stroke="#2bc3d4" stroke-width="1.2"/>
    <path d="M16,13 v-3 a4,4 0 0 1 8,0 v3 M13,13 h14 v9 h-14 Z" fill="none" stroke="#2bc3d4" stroke-width="1.4" stroke-linejoin="round"/>
    <text x="77" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#2bc3d4">isolated origin</text>
  </g>

  <!-- viewport -->
  <rect x="96" y="184" width="848" height="150" rx="11" fill="#0f1a28" stroke="#26394e" stroke-width="1.2"/>
  <g stroke="#2bc3d4" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="0.9">
    <path d="M164,238 L199,255 L199,289 L164,306 L129,289 L129,255 Z"/>
    <path d="M164,238 L164,272 M164,272 L199,255 M164,272 L129,255 M164,272 L164,306" opacity="0.6"/>
  </g>
  <text x="240" y="252" font-size="15" font-weight="600" fill="#e7eef7">GPU-driven 3D scene</text>
  <text x="240" y="273" class="mono" font-size="12.5" fill="#9db0c3">cull compute → multi-draw indirect · HiZ · TAA · VBAO</text>
  <text x="240" y="296" font-size="12.5" fill="#67798d">Renders cooked .model files within 5–10% of the native Vulkan renderer.</text>

  <text x="96" y="362" class="mono" font-size="12" fill="#9db0c3" letter-spacing="0.06">YOUR PANELS — each a company-owned iframe inside the viewer, driving window.parent</text>

  <!-- panel 1: project selector -->
  <rect x="96" y="374" width="266" height="278" rx="12" fill="#14202f" stroke="#8b9bff" stroke-width="1.6"/>
  <rect x="96" y="374" width="266" height="34" rx="12" fill="#1a2240"/>
  <rect x="96" y="396" width="266" height="12" fill="#1a2240"/>
  <line x1="96" y1="408" x2="362" y2="408" stroke="#8b9bff" stroke-width="1" opacity="0.5"/>
  <text x="112" y="396" class="mono" font-size="11.5" font-weight="700" fill="#8b9bff">3dviewer.company.com</text>
  <text x="114" y="431" font-size="13.5" font-weight="600" fill="#e7eef7">Project selector</text>
  <text x="114" y="448" class="mono" font-size="11" fill="#67798d">/select-project</text>
  <text x="114" y="470" font-size="12" fill="#9db0c3">Streams new &amp; changed</text>
  <text x="114" y="486" font-size="12" fill="#9db0c3">models into the viewer;</text>
  <text x="114" y="502" font-size="12" fill="#9db0c3">loads a SQLite DB.</text>
  <text x="114" y="528" class="mono" font-size="10.5" fill="#8b9bff">assets.list · import · sql.import</text>
  <text x="114" y="620" class="mono" font-size="10.5" fill="#67798d">same domain as host</text>
  <text x="114" y="634" class="mono" font-size="10.5" fill="#67798d">sandbox: allow-same-origin</text>
  <g transform="translate(330,384)"><path d="M4,8 v-2 a4,4 0 0 1 8,0 v2 M1,8 h14 v9 h-14 Z" fill="none" stroke="#8b9bff" stroke-width="1.3" stroke-linejoin="round"/></g>

  <!-- panel 2: report viewer -->
  <rect x="387" y="374" width="266" height="278" rx="12" fill="#14202f" stroke="#8b9bff" stroke-width="1.6"/>
  <rect x="387" y="374" width="266" height="34" rx="12" fill="#1a2240"/>
  <rect x="387" y="396" width="266" height="12" fill="#1a2240"/>
  <line x1="387" y1="408" x2="653" y2="408" stroke="#8b9bff" stroke-width="1" opacity="0.5"/>
  <text x="403" y="396" class="mono" font-size="11.5" font-weight="700" fill="#8b9bff">reports.company.com</text>
  <text x="405" y="431" font-size="13.5" font-weight="600" fill="#e7eef7">Report viewer</text>
  <text x="405" y="453" font-size="12" fill="#9db0c3">Pushes large name sets;</text>
  <text x="405" y="469" font-size="12" fill="#9db0c3">selects or colors them</text>
  <text x="405" y="485" font-size="12" fill="#9db0c3">in one call.</text>
  <text x="405" y="511" class="mono" font-size="10.5" fill="#8b9bff">selection.set · colorRules.set</text>
  <text x="405" y="527" class="mono" font-size="10.5" fill="#67798d">data: company API · SQLite</text>
  <text x="405" y="620" class="mono" font-size="10.5" fill="#67798d">cross-origin · first-party</text>
  <text x="405" y="634" class="mono" font-size="10.5" fill="#67798d">sandbox: allow-same-origin</text>
  <g transform="translate(621,384)"><path d="M4,8 v-2 a4,4 0 0 1 8,0 v2 M1,8 h14 v9 h-14 Z" fill="none" stroke="#8b9bff" stroke-width="1.3" stroke-linejoin="round"/></g>

  <!-- panel 3: detail data viewer -->
  <rect x="678" y="374" width="266" height="278" rx="12" fill="#14202f" stroke="#8b9bff" stroke-width="1.6"/>
  <rect x="678" y="374" width="266" height="34" rx="12" fill="#1a2240"/>
  <rect x="678" y="396" width="266" height="12" fill="#1a2240"/>
  <line x1="678" y1="408" x2="944" y2="408" stroke="#8b9bff" stroke-width="1" opacity="0.5"/>
  <text x="694" y="396" class="mono" font-size="11.5" font-weight="700" fill="#8b9bff">attributes.company.com</text>
  <text x="696" y="431" font-size="13.5" font-weight="600" fill="#e7eef7">Detail data viewer</text>
  <text x="696" y="453" font-size="12" fill="#9db0c3">Follows selection events</text>
  <text x="696" y="469" font-size="12" fill="#9db0c3">from the main frame; shows</text>
  <text x="696" y="485" font-size="12" fill="#9db0c3">attributes on click.</text>
  <text x="696" y="511" class="mono" font-size="10.5" fill="#8b9bff">on tree.select → sql.query</text>
  <text x="696" y="527" class="mono" font-size="10.5" fill="#67798d">data: own API · built-in</text>
  <text x="696" y="620" class="mono" font-size="10.5" fill="#67798d">cross-origin · first-party</text>
  <text x="696" y="634" class="mono" font-size="10.5" fill="#67798d">sandbox: allow-same-origin</text>
  <g transform="translate(912,384)"><path d="M4,8 v-2 a4,4 0 0 1 8,0 v2 M1,8 h14 v9 h-14 Z" fill="none" stroke="#8b9bff" stroke-width="1.3" stroke-linejoin="round"/></g>

  <!-- bridge -->
  <line x1="30" y1="98" x2="72" y2="98" stroke="#2bc3d4" stroke-width="1.7" stroke-dasharray="4 4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="968" y1="118" x2="968" y2="652" stroke="#2bc3d4" stroke-width="1.4" stroke-dasharray="5 5" opacity="0.5"/>
  <text x="512" y="712" text-anchor="middle" class="mono" font-size="12" fill="#67798d">· · ·  postMessage — origin-locked, protocol v1  · · ·</text>
</svg>
