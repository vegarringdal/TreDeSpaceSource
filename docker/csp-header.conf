# The Content-Security-Policy of every page (viewer, /docs/, /demo/) — the same
# policy the build writes into each page as a meta tag (scripts/page-csp.mjs;
# tests/securityHeaders.test.ts keeps the two equal). Only on documents: a
# worker takes its policy from its own script's response, and workers are
# deliberately left without one (DESIGN.md › "Untrusted input & CSP").
add_header Content-Security-Policy "script-src 'self' 'wasm-unsafe-eval'; object-src 'none'; base-uri 'self'" always;
