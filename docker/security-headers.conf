# Sent with every response (included by each location in nginx.conf: a
# location with its own add_header stops nginx inheriting the server's).
#
# nosniff: a file is only ever run or styled as the type nginx names, so an
# uploaded or mis-served file cannot turn into script.
add_header X-Content-Type-Options "nosniff" always;
# strict-origin-when-cross-origin: other origins see only ours, never a path
# or query (an embed URL's ?apiOrigins=). Not no-referrer: a tab the viewer
# opens for an External app finds the viewer's origin in document.referrer
# (EVENTS.md).
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
