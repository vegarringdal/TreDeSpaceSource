# TreDeSpace SPA server (rootless nginx-unprivileged, listens on 8080).
server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # hashed build assets — cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # never cache the entry point or the version probe
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /build.version {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # clean doc URLs (/docs/events → docs/events.html), then the SPA fallback
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm;
}
