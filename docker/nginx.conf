# TreDeSpace SPA server (rootless nginx-unprivileged, listens on 8080).
#
# Every location includes the security headers itself: nginx drops the
# server's add_header lines in any location that has its own.
server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # hashed build assets (scripts, workers, wasm, styles) — cache forever
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # never cache the entry point or the version probe
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-header.conf;
        add_header Cache-Control "no-cache";
    }
    location = /build.version {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        default_type text/plain;
        try_files $uri =404;
    }

    # the host SDK, offered for copying: text, not nginx's video/mp2t for .ts
    location = /docs/tredespace-client.ts {
        include /etc/nginx/snippets/security-headers.conf;
        types { }
        default_type text/plain;
        charset utf-8;
        try_files $uri =404;
    }

    # clean doc URLs (/docs/events → docs/events.html), then the SPA fallback
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-header.conf;
        try_files $uri $uri.html $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm;
}
