[package]
name = "ifc-core"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "IFC → GLB conversion engine (filesystem-free)."

[lib]
path = "src/lib.rs"

[dependencies]
ifc-lite-processing.workspace = true
serde_json = "1"
# PNG-encode embedded textures for standard-mode GLB output. Keep the default features
# (the encoder is gated behind them); the encode path is pure-Rust and wasm-safe.
png = "0.18"

[dev-dependencies]
serde_json = "1"
