# GLB / merged model → cooked CADM pipeline as a LIBRARY: no I/O policy, no
# CLI, no wasm — cooker-wasm and the converters' wasm and CLI crates wrap it.
# Port of the native reference cad-cooker (removed with the native renderer),
# kept format-identical so the web viewer's parser (src/lib/model/format.ts)
# reads the output unchanged.
[package]
name = "cooker-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true
rustc-hash.workspace = true
cad-format = { path = "../cad-format" }
meshopt = { path = "../meshopt" }

[dev-dependencies]
bytemuck.workspace = true
# RVM → GLB for the golden pipeline test. default-features = false mirrors the
# wasm shell the app ships (no meshopt simplification pass) and keeps the
# native C++ meshopt build out of `cargo test`.
rvm-core = { path = "../rvm-core", default-features = false }
