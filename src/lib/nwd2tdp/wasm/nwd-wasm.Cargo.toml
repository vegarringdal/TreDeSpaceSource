[package]
name = "nwd-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "WebAssembly shell for nwd-core: NWD → .tdp in the browser (Worker + OPFS)"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# meshopt simplification of welded parts (needs clang for wasm32).
optimize = ["nwd-core/optimize"]

[dependencies]
nwd-core = { path = "../nwd-core" }
# NWD → per-root merged GLB (in memory) → .tdp; no GLB file is written.
cooker-core = { path = "../cooker-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde.workspace = true
serde_json.workspace = true
console_error_panic_hook = "0.1"

[package.metadata.wasm-pack.profile.release]
# no binaryen download in the sandbox; LTO already trims the module
wasm-opt = false
